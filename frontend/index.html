<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Identité ─────────────────────────────────────────────── -->
    <title>Sahel Market — Artisanat authentique du Cameroun</title>
    <meta name="description"
      content="Découvrez l'artisanat camerounais : sacs en cuir, bijoux, chaussures, pagnes, paniers tressés. Achetez directement auprès des artisans du Sahel. Livraison partout au Cameroun." />
    <meta name="keywords"
      content="artisanat cameroun, sahel market, maroquinerie maroua, bijoux africains, pagnes wax, vannerie cameroun, made in cameroun" />
    <meta name="author" content="Sahel Market" />
    <meta name="robots" content="index, follow" />

    <!-- ── PWA ──────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sahel Market" />

    <!-- ── Icônes ────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- ── Open Graph (partage réseaux sociaux / WhatsApp / Facebook) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahel Market" />
    <meta property="og:url" content="https://sahel-market-gamma.vercel.app/" />
    <meta property="og:title" content="Sahel Market — Artisanat authentique du Cameroun" />
    <meta property="og:description"
      content="La première plateforme dédiée à l'artisanat du Sahel. Sacs, bijoux, chaussures et pagnes fabriqués à la main par des artisans camerounais." />
    <meta property="og:image" content="https://sahel-market-gamma.vercel.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sahel Market — Artisanat camerounais livré chez vous" />
    <meta property="og:locale" content="fr_CM" />

    <!-- ── Twitter / X Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sahel Market — Artisanat du Cameroun" />
    <meta name="twitter:description"
      content="Achetez l'artisanat camerounais directement auprès des artisans. Livraison partout au Cameroun." />
    <meta name="twitter:image" content="https://sahel-market-gamma.vercel.app/og-image.svg" />

    <!-- ── Police Inter (préchargement) ─────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ── Enregistrement Service Worker ───────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(() => {})
        })
      }
    </script>
  </body>
</html>
